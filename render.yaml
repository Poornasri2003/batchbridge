# FREE initial preview. Database expires after 30 days and web service sleeps.
# Before judging, arrange lasting storage/compute; see render.judging.yaml.
services:
  - type: web
    name: batchbridge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: batchbridge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: merchant@example.invalid
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_MODE
        value: true
      - key: AI_PROVIDER
        value: huggingface
      - key: MAX_AI_CALLS_PER_HOUR
        value: 30
      - key: HF_TOKEN
        value: ""
      - key: HF_MODEL
        value: ""
      - key: ELASTICSEARCH_URL
        value: ""
      - key: ELASTICSEARCH_API_KEY
        value: ""
      - key: ELASTICSEARCH_INDEX
        value: batchbridge-inquiries
      - key: PAYPAL_CLIENT_ID
        value: ""
      - key: PAYPAL_CLIENT_SECRET
        value: ""
      - key: PAYPAL_MERCHANT_ID
        value: ""
databases:
  - name: batchbridge-db
    plan: free
    region: singapore
    databaseName: batchbridge
    user: batchbridge
