# This Blueprint uses PAID compute/database plans to stay available through judging.
# Review Render's displayed prices and available hackathon credits before creating.
services:
  - type: web
    name: batchbridge
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: batchbridge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: true
      - key: AI_PROVIDER
        value: huggingface
      - key: MAX_AI_CALLS_PER_HOUR
        value: 30
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: batchbridge-inquiries
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
databases:
  - name: batchbridge-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: singapore
    databaseName: batchbridge
    user: batchbridge
